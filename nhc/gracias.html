<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pago · NeoHumanCode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/nhc.css">
  <link rel="icon" href="assets/favicon.png">
  <meta name="theme-color" content="#FFF8F0">
</head>
<body>
  <header class="top"><div class="wrap"><a href="./" data-logo aria-label="NeoHumanCode"></a></div></header>
  <main class="narrow">
    <div class="panel center" id="panel">
      <h2 id="titulo">Confirmando tu pago…</h2>
      <p class="lead" id="texto">Esto tarda unos segundos.</p>
      <div class="actions" style="justify-content:center"><a class="btn hidden" id="cta" href="#">Ingresar mis datos</a></div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    const qs = new URLSearchParams(location.search);
    const t = qs.get("t") || "";
    const gt = qs.get("g") || "";
    const $ = (id) => document.getElementById(id);
    let intentos = 0;

    async function revisar() {
      try {
        const p = await fn("pedido", { query: gt ? `?g=${encodeURIComponent(gt)}` : `?t=${encodeURIComponent(t)}` });
        if (p.estado === "pagado" && p.tipo === "gift") {
          $("titulo").textContent = `¡Gracias, ${p.nombre}! 🎁`;
          $("texto").textContent = `Tu gift card está lista. Le enviamos el código a ${p.destinatario_email}. Por si querés compartirlo vos: ${p.codigo}. Vence el ${new Date(p.vence).toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" })}.`;
          return;
        }
        if (p.estado === "pagado") {
          $("titulo").textContent = `¡Gracias, ${p.nombre}!`;
          if (p.datos_enviados) {
            $("texto").textContent = "Ya recibimos tus datos. Te enviaremos tus informes por mail.";
          } else {
            $("texto").textContent = "Tu pago está confirmado. Te enviamos un mail y falta un último paso: tus datos de nacimiento.";
            $("cta").href = `datos.html?t=${encodeURIComponent(t)}`;
            $("cta").classList.remove("hidden");
          }
          return;
        }
        if (++intentos < 20) return setTimeout(revisar, 3000);
        $("titulo").textContent = "Todavía no vemos tu pago";
        $("texto").textContent = "Si ya pagaste, puede demorar unos minutos. Te escribimos por mail apenas se acredite; también podés volver a esta página.";
      } catch {
        $("titulo").textContent = "Enlace inválido";
        $("texto").textContent = "Revisá el enlace que te enviamos por mail.";
      }
    }
    revisar();
  </script>
</body>
</html>
