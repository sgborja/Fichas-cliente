<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · NeoHumanCode</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/nhc.css">
  <link rel="icon" href="assets/favicon.png">
  <meta name="theme-color" content="#FFF8F0">
</head>
<body>
  <header class="top"><div class="wrap"><a href="./" data-logo aria-label="NeoHumanCode"></a>
    <button class="btn ghost hidden" id="salir">Salir</button></div></header>
  <main class="narrow">
    <form class="panel" id="login">
      <h2>Panel de administración</h2>
      <p class="lead">Ingresá para editar los informes.</p>
      <label for="u">Mail</label><input id="u" type="email" autocomplete="username" required>
      <label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="btn" type="submit">Entrar</button></div>
      <p class="msg" id="lmsg" role="alert"></p>
    </form>

    <div id="app" class="hidden">
      <nav class="tabs" role="tablist" style="margin-top:24px">
        <button class="tab on" data-tab="pedidos" role="tab">Pedidos</button>
        <button class="tab" data-tab="gifts" role="tab">Gift cards</button>
        <button class="tab" data-tab="config" role="tab">Informes y precio</button>
      </nav>

      <section id="t-pedidos">
        <div class="resumen" id="resPedidos"></div>
        <div id="listaPedidos"></div>
      </section>

      <section id="t-gifts" class="hidden">
        <div class="resumen" id="resGifts"></div>
        <div id="listaGifts"></div>
      </section>

      <section id="t-config" class="hidden">
      <div class="admin-card">
        <h3>Precio (pagás 3, recibís los 4 informes)</h3>
        <div class="row" style="margin-top:8px">
          <div><label for="precio">Valor</label><input id="precio" type="number" min="1" step="1"></div>
          <div><label for="moneda">Moneda</label><input id="moneda" maxlength="3" value="ARS"></div>
        </div>
        <div class="actions"><button class="btn" id="gPrecio">Guardar precio</button><span class="msg" id="mPrecio"></span></div>
      </div>
      <h2 style="margin:28px 0 14px">Informes</h2>
      <div id="lista"></div>
      <button class="btn ghost" id="nuevo" style="margin-bottom:60px">+ Agregar informe</button>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
